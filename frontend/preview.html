<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoomMind — Room preview</title>
<style>
:root{font-family:Roboto,Arial,sans-serif;color:#e6edf4;background:#111820;--primary-color:#5dbbff;--primary-text-color:#e6edf4;--secondary-text-color:#9daebd;--card-background-color:#1a242f;--ha-card-background:#1a242f;--divider-color:#334250;--secondary-background-color:#202d39;--primary-background-color:#111820;--disabled-text-color:#708393;--error-color:#ff7f85}body{margin:0;padding:28px 36px}header{max-width:1400px;margin:0 auto 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:26px;margin:0 0 8px}p{color:#9daebd;font-size:14px;margin:0}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:1.2fr 1fr;gap:24px}section{background:#1a242f;border:1px solid #334250;border-radius:18px;padding:24px;min-width:0}h2{font-size:18px;margin:0 0 24px}.badge{background:#223b49;color:#8cdddc;border-radius:20px;padding:9px 14px;font-size:12px}#saved{font-size:13px;color:#8cdddc;margin-top:18px;min-height:18px}@media(max-width:850px){body{padding:20px}main{grid-template-columns:1fr}}
